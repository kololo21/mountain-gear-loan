{% extends 'layout.html' %}
{% block title %}部員削除{% endblock %}
{% block content %}
<h2>部員削除の確認</h2>
<p>以下の部員を削除します。よろしいですか？</p>
<table>
  <tr><th>番号</th><td>{{ member.member_id }}</td></tr>
  <tr><th>氏名</th><td>{{ member.name }}</td></tr>
</table>
<form method="POST" action="{{ url_for('members_del_execute', id=member.member_id) }}">
  <p><input type="submit" value="削除する"></p>
</form>
<p><a href="{{ url_for('members_detail', id=member.member_id) }}">やめる（詳細へ戻る）</a></p>
{% endblock %}
