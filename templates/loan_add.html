{% extends 'layout.html' %}
{% block title %}貸出登録{% endblock %}
{% block content %}
<h2>貸出登録</h2>
{% if errors %}<div class="errors"><ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>{% endif %}
<form method="POST" action="{{ url_for('loan_add_execute') }}">
  <p><label>備品 *</label>
    <select name="equip_id">
      <option value="">（選択してください）</option>
      {% for e in equipments %}
      <option value="{{ e.equip_id }}" {% if form.equip_id == e.equip_id|string %}selected{% endif %}>
        {{ e.equip_name }}{% if e.condition == '廃棄' %}（廃棄）{% endif %}</option>
      {% endfor %}
    </select></p>
  <p><label>部員 *</label>
    <select name="member_id">
      <option value="">（選択してください）</option>
      {% for m in members %}
      <option value="{{ m.member_id }}" {% if form.member_id == m.member_id|string %}selected{% endif %}>{{ m.name }}</option>
      {% endfor %}
    </select></p>
  <p><label>山行 *</label>
    <select name="trip_id">
      <option value="">（選択してください）</option>
      {% for t in trips %}
      <option value="{{ t.trip_id }}" {% if form.trip_id == t.trip_id|string %}selected{% endif %}>{{ t.trip_name }}</option>
      {% endfor %}
    </select></p>
  <p><label>貸出日</label><input type="text" name="lent_on" value="{{ form.lent_on }}"> (YYYY-MM-DD)</p>
  <p><label>返却期限</label><input type="text" name="due_on" value="{{ form.due_on }}"> (YYYY-MM-DD)</p>
  <p><input type="submit" value="登録する"></p>
</form>
<p><a href="{{ url_for('loans') }}">貸出台帳へ戻る</a></p>
{% endblock %}
