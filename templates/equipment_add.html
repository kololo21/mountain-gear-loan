{% extends 'layout.html' %}
{% block title %}備品追加{% endblock %}
{% block content %}
<h2>備品追加</h2>
{% if errors %}
<div class="errors"><ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>
{% endif %}
<form method="POST" action="{{ url_for('equipment_add_execute') }}">
  <p><label>備品名 *</label><input type="text" name="equip_name" value="{{ form.equip_name }}"></p>
  <p><label>カテゴリ</label>
    <select name="category">
      <option value="">（未選択）</option>
      {% for c in categories %}
      <option value="{{ c }}" {% if c == form.category %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select></p>
  <p><label>メーカー</label><input type="text" name="maker_name" value="{{ form.maker_name }}"></p>
  <p><label>購入日</label><input type="text" name="purchased_on" value="{{ form.purchased_on }}"> (YYYY-MM-DD)</p>
  <p><label>状態</label>
    <select name="condition">
      <option value="">（未選択）</option>
      {% for c in conditions %}
      <option value="{{ c }}" {% if c == form.condition %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select></p>
  <p><input type="submit" value="追加する"></p>
</form>
<p><a href="{{ url_for('equipment_list') }}">備品一覧へ戻る</a></p>
{% endblock %}
